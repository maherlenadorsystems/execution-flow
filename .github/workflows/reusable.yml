name: Reusable Deploy

on: 
  workflow_call:
    inputs:
      artifact-name:
        description: the name of Deployable artifact files
        type: string
        default: dist
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Get Code
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.artifact-name }}

      - name: List files
        run: ls
      - name: Output Information
        run: echo "Deploying & Uploading..."